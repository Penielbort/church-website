<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d001a"/>
      <stop offset="100%" stop-color="#0d0018"/>
    </linearGradient>
    <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7a5800" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="300" height="340" fill="url(#bg)"/>
  <!-- Cross pattern subtle -->
  <line x1="150" y1="0" x2="150" y2="340" stroke="rgba(201,162,39,0.06)" stroke-width="1"/>
  <line x1="0" y1="170" x2="300" y2="170" stroke="rgba(201,162,39,0.06)" stroke-width="1"/>
  <!-- Outer ring -->
  <circle cx="150" cy="140" r="95" fill="none" stroke="rgba(201,162,39,0.15)" stroke-width="1.5"/>
  <!-- Body silhouette -->
  <ellipse cx="150" cy="310" rx="110" ry="60" fill="rgba(201,162,39,0.08)"/>
  <rect x="80" y="220" width="140" height="100" rx="8" fill="rgba(201,162,39,0.06)"/>
  <!-- Head -->
  <circle cx="150" cy="130" r="70" fill="url(#circle)"/>
  <!-- Face features subtle -->
  <circle cx="130" cy="120" r="6" fill="rgba(255,255,255,0.15)"/>
  <circle cx="170" cy="120" r="6" fill="rgba(255,255,255,0.15)"/>
  <path d="M 130 148 Q 150 162 170 148" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Cross -->
  <line x1="150" y1="40" x2="150" y2="80" stroke="rgba(201,162,39,0.5)" stroke-width="2.5"/>
  <line x1="133" y1="56" x2="167" y2="56" stroke="rgba(201,162,39,0.5)" stroke-width="2.5"/>
  <!-- Initials -->
  <text x="150" y="145" font-family="Georgia,serif" font-size="52" fill="rgba(201,162,39,0.7)" text-anchor="middle" dominant-baseline="middle">JM</text>
  <!-- Photo placeholder label -->
  <text x="150" y="295" font-family="Georgia,serif" font-size="11" fill="rgba(201,162,39,0.4)" text-anchor="middle" letter-spacing="2">PHOTO</text>
</svg>